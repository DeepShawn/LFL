<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172b32">
  <meta name="description" content="附中夜录：最后一遍点名。虚构校园恐怖解谜游戏，支持双视角、SAN生存与自动存档。">
  <title>附中夜录 · 最后一遍点名</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23263749'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' fill='%23c6a76b'%3E册%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="title-screen" class="title-screen">
    <div class="night-scene" aria-hidden="true"><div class="moon"></div><div class="school-silhouette"><div class="school-sign">附属中学</div><div class="windows"></div><div class="school-door"></div></div><div class="rain-lines"></div><div class="streetlight"></div></div>
    <div class="title-layout">
      <header class="title-copy"><p class="clock">22:17 <span>夜间清点记录</span></p><h1>附中夜录</h1><p class="subtitle">最后一遍点名</p><p class="tagline">广播叫到你的名字时，<br>先确认它念的是哪一行。</p><span class="red-stamp">多出一人</span></header>
      <section class="entry-panel" aria-label="选择游戏模式">
        <p class="entry-heading">今晚，你从哪里开始？</p>
        <button class="mode-button" data-new="tutorial"><span>新手教程</span><small>练习视角切换、定神与躲藏</small><b>入夜演习</b></button>
        <button class="mode-button" data-new="easy"><span>简单模式</span><small>留意纸背，慢慢找回自己的名字</small><b>清醒入校</b></button>
        <button class="mode-button" data-new="hard"><span>困难模式</span><small>SAN消耗更快，脚步声离你更近</small><b>独自值夜</b></button>
        <div id="save-list" class="save-list"></div>
        <div class="title-actions"><button id="title-settings" class="text-button">声音与显示</button><button id="about-button" class="text-button">游玩与部署说明</button></div>
        <p id="boot-status" role="status">正在检查本地记录……</p>
      </section>
    </div>
    <footer class="disclaimer">虚构故事 · 空间参考武汉大学附属中学用户示意图，室内布局、人物、仪式与事件均为原创，不代表真实校史。<br>含追逐、压迫氛围与声音干扰。无麦克风、无定位、无联网账号；存档仅保存在本机浏览器。</footer>
  </main>

  <section id="game-screen" class="game-screen" hidden aria-label="校园探索">
    <canvas id="view-3d" aria-label="第一人称校园视野"></canvas><canvas id="view-2d" hidden aria-label="2D俯视校园视野"></canvas>
    <div id="san-shade" aria-hidden="true"></div><div id="crosshair" aria-hidden="true"></div>
    <header class="hud-top"><div class="location-block"><span id="mode-label"></span><strong id="location-label"></strong><span id="game-clock">22:17</span></div><div class="hud-nav"><button id="journal-button">手记 <kbd>J</kbd></button><button id="map-button">地图 <kbd>M</kbd></button><button id="pause-button">暂停 <kbd>Esc</kbd></button></div></header>
    <section class="objective-box"><p id="objective"></p><p id="tutorial-progress"></p><button id="finish-tutorial" hidden>完成教程</button></section>
    <div id="save-status" role="status"></div>
    <aside id="minimap-panel" aria-label="当前楼层小地图" hidden><header><span id="minimap-label">北 ↑</span><button id="minimap-toggle" aria-expanded="true" aria-controls="minimap-canvas">收起</button></header><canvas id="minimap-canvas" aria-label="玩家、楼梯、出口和安全灯位置"></canvas><p id="minimap-legend">▲ 你　阶 楼梯　门 出口　灯 定神</p></aside>
    <div id="subtitles" role="status" aria-live="polite"></div>
    <div id="interaction-prompt"></div>
    <div id="look-hint">拖动画面或点击锁定鼠标观察 · V 切换视角</div>
    <section class="vitals" aria-label="玩家状态"><div class="san-row"><span>SAN <b id="san-value">100</b></span><span id="san-label">清醒</span></div><progress id="san-meter" max="100" value="100" aria-label="SAN值"></progress><div class="stamina-row"><span>体力</span><progress id="stamina-meter" max="100" value="100" aria-label="体力"></progress><span id="water-count">温水 0</span></div><p id="recovery-hint"></p></section>
    <div class="action-dock"><button id="view-button">切换视角 <kbd>V</kbd></button><button id="light-button">手电 <kbd>F</kbd></button><button id="drink-button">温水 <kbd>H</kbd></button><button id="rest-button">按住定神 <kbd>R</kbd></button><button id="interact-button" class="primary">调查 <kbd>E</kbd></button></div>
    <div id="joystick" class="joystick" aria-label="移动摇杆"><span></span><i id="joystick-knob"></i></div><button id="sprint-button" class="sprint-button">按住<br>冲刺</button>
  </section>

  <dialog id="interaction-dialog" class="paper-dialog" aria-label="调查物件"></dialog>
  <dialog id="system-dialog" class="system-dialog" aria-label="游戏菜单"><div id="system-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>本游戏需要启用JavaScript。请通过HTTP/HTTPS打开网页，而不是文件预览器。</noscript>
  <script type="module" src="./main.js"></script>
</body>
</html>
